# Shared security checks for every public repo: leaked secrets and private details (betterleaks),
# commit identity, code issues (opengrep), and npm and Python dependencies installed through Aikido safe-chain.
# Each repo calls this from .github/workflows/security.yml, and its main branch ruleset requires
# "security / Leaks", "security / Code scan" and "security / Packages" to pass.
name: PR security

on:
  workflow_call:
    secrets:
      LEAK_PATTERNS:
        description: Regex of private identifiers (employer, home network, personal emails, local paths). Kept in a secret so the list itself stays private.
        required: false

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.9.0
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
  OPENGREP_VERSION: v1.30.1
  OPENGREP_SHA256: d3195b9d8d5ae93179f6aa5f5daaba6a920a5a09d38c5d5ae5e60924050210c4
  OPENGREP_RULES_SHA: f1d2b562b414783763fd02a6ed2736eaed622efa
  SAFE_CHAIN_VERSION: 1.5.23
  SAFE_CHAIN_INSTALLER_SHA256: b7eac1c7152f300b229b865193d16424ad52386d1898c75ffaf374fcb4eeed3d

jobs:
  leaks:
    name: Leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the commits to check
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER~1..$PUSH_AFTER"
            git rev-parse -q --verify "$PUSH_AFTER~1" >/dev/null || range="$PUSH_AFTER"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "[security] Checking commits $range ($(git rev-list --count "$range") commits)"

      - name: Commit identity
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          # Only the GitHub noreply address, bots and GitHub's own merges may appear in commit metadata.
          bad=0
          while read -r sha author committer; do
            for email in "$author" "$committer"; do
              case "$email" in
                37880339+dmcphearson@users.noreply.github.com|noreply@github.com|*\[bot\]@users.noreply.github.com) ;;
                *) echo "::error::[security] Commit ${sha:0:7} uses an email that isn't the GitHub noreply address."; bad=1 ;;
              esac
            done
          done < <(git log --format='%H %ae %ce' "$RANGE")
          exit $bad

      - name: Private details in commit messages
        env:
          RANGE: ${{ steps.range.outputs.range }}
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            echo "::error::[security] The LEAK_PATTERNS secret is missing (Actions and Dependabot secrets both need it)."
            exit 1
          fi
          bad=0
          for sha in $(git rev-list "$RANGE"); do
            if git log -1 --format='%B' "$sha" | grep -Eiq -- "$LEAK_PATTERNS"; then
              echo "::error::[security] Commit ${sha:0:7}'s message contains a private identifier."
              bad=1
            fi
          done
          exit $bad

      - name: Install betterleaks
        run: |
          curl -fsSLo bl.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  bl.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf bl.tar.gz -C "$RUNNER_TEMP/bin" betterleaks && rm bl.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the changes for secrets and private details
        env:
          RANGE: ${{ steps.range.outputs.range }}
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          # The config lives outside the repo, and allow comments and ignore files are ignored,
          # so a pull request can't switch its own checks off.
          config="$RUNNER_TEMP/betterleaks.toml"
          {
            printf '[extend]\nuseDefault = true\n\n'
            printf '[[rules]]\nid = "private-identifier"\n'
            printf 'description = "Private identifier: employer, home network, personal email or local path"\n'
            printf "regex = '''(?i)(%s)'''\n" "$LEAK_PATTERNS"
          } > "$config"
          mkdir -p "$RUNNER_TEMP/no-ignore"
          report="$RUNNER_TEMP/betterleaks.json"
          # No --verbose: it prints each finding's whole line, which can expose a neighbouring match.
          # Report only where each finding is, never its text.
          betterleaks git . \
            --log-opts="$RANGE" \
            --config "$config" \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" \
            --ignore-gitleaks-allow \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$report" || status=$?
          if [ ! -s "$report" ]; then
            echo "::error::[security] betterleaks failed to run (exit ${status:-0})."
            exit 1
          fi
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::[security] \(.RuleID) in commit \(.Commit[0:7])"' "$report"
          echo "[security] betterleaks: $(jq length "$report") findings"
          [ "${status:-0}" -eq 0 ]

  code:
    name: Code scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout opengrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengrep/opengrep-rules
          ref: ${{ env.OPENGREP_RULES_SHA }}
          path: .opengrep-rules
          persist-credentials: false
          sparse-checkout: |
            ai
            bash
            dockerfile
            generic
            go
            html
            javascript
            json
            python
            swift
            terraform
            typescript
            yaml

      - name: Install opengrep
        run: |
          # Checkout only writes inside the workspace; move the rules out so they aren't scanned.
          mv .opengrep-rules "$RUNNER_TEMP/rules"
          curl -fsSLo "$RUNNER_TEMP/opengrep" "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"

      - name: Scan
        run: |
          # Rule test fixtures sit beside the rules; only the rule files are loaded.
          configs=()
          while IFS= read -r f; do configs+=(--config "$f"); done < <(
            find "$RUNNER_TEMP/rules" -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name '*.test.yaml' ! -name '*.test.yml' ! -path '*/.github/*' -print0 \
              | xargs -0 grep -l '^rules:' )
          echo "[security] Loading ${#configs[@]} rule files"
          "$RUNNER_TEMP/opengrep" scan "${configs[@]}" \
            --sarif-output=opengrep.sarif \
            --json-output=opengrep.json \
            --exclude=node_modules --exclude=vendor --exclude=dist \
            . || status=$?
          if [ "${status:-0}" -ne 0 ] && [ ! -s opengrep.json ]; then
            echo "::error::[security] opengrep failed to run (exit ${status})."
            exit 1
          fi
          # Block only on ERROR-severity security rules. Audit rules flag every use of an API
          # (every subprocess call, say), and style rules aren't security.
          blocking='.results[] | .rule = (.check_id | sub("^.*?\\.rules\\."; "")) | select(.extra.severity == "ERROR" and (.rule | test("\\.security\\.")) and (.rule | test("\\.audit\\.") | not))'
          errors=$(jq "[$blocking] | length" opengrep.json)
          total=$(jq '.results | length' opengrep.json)
          echo "[security] opengrep: ${total} findings, ${errors} blocking (ERROR-severity security rules, audit rules excluded)"
          jq -r "$blocking | \"::error file=\\(.path),line=\\(.start.line)::\\(.rule)\"" opengrep.json
          # Code scanning gets only the blocking findings, so an open alert always means a real issue.
          ids=$(jq -c "[$blocking | .check_id] | unique" opengrep.json)
          jq --argjson ids "$ids" '.runs[].results |= map(select(.ruleId as $r | $ids | index($r)))' opengrep.sarif > opengrep-blocking.sarif
          [ "$errors" -eq 0 ]

      - name: Upload results to code scanning
        if: always() && hashFiles('opengrep-blocking.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: opengrep-blocking.sarif
          category: opengrep

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find npm and Python dependencies
        id: find
        run: |
          npm_dirs=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -exec dirname {} \; | sort -u)
          py_files=$(find . \( -name 'requirements*.txt' -o -name pyproject.toml \) -not -path './.git/*' -not -path '*/node_modules/*' | sort -u)
          { echo "npm_dirs<<EOF"; echo "$npm_dirs"; echo EOF; echo "py_files<<EOF"; echo "$py_files"; echo EOF; } >> "$GITHUB_OUTPUT"
          if [ -z "$npm_dirs$py_files" ]; then
            echo "[security] No npm or Python dependencies; nothing to check."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install safe-chain
        if: steps.find.outputs.any == 'true'
        run: |
          # The installer checks the safe-chain binary against hashes built into it; pinning the installer pins both.
          curl -fsSLo "$RUNNER_TEMP/install-safe-chain.sh" "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh"
          echo "${SAFE_CHAIN_INSTALLER_SHA256}  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci

      - name: Install dependencies through safe-chain
        if: steps.find.outputs.any == 'true'
        env:
          NPM_DIRS: ${{ steps.find.outputs.npm_dirs }}
          PY_FILES: ${{ steps.find.outputs.py_files }}
        run: |
          # Downloads go through safe-chain's proxy, which blocks known malware and packages under 48 hours old.
          # Install scripts never run, so a package is checked without executing it.
          # Fail closed if the wrapper isn't in front of npm and pip.
          [ -z "$NPM_DIRS" ] || npm safe-chain-verify
          [ -z "$PY_FILES" ] || pip3 safe-chain-verify
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "[security] npm dependencies in $dir"
            if [ -f "$dir/package-lock.json" ] || [ -f "$dir/npm-shrinkwrap.json" ]; then
              (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            else
              (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund --no-package-lock)
            fi
          done <<< "$NPM_DIRS"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "[security] Python dependencies in $file"
            dest="$RUNNER_TEMP/pydeps/$(echo "$file" | tr '/.' '__')"
            case "$file" in
              *.txt) pip3 download --quiet -r "$file" -d "$dest" ;;
              *) pip3 download --quiet "$(dirname "$file")" -d "$dest" ;;
            esac
          done <<< "$PY_FILES"
          echo "[security] All dependencies passed safe-chain."
